apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
data:
  service.email: |
    host: smtp.example.local
    port: 587
    from: argocd@example.local
    username: $email-username
    password: $email-password
    startTLS:
      enable: true
    insecureSkipVerify: false

  template.app-production-outofsync: |
    email:
      subject: "[Argo CD] Production application OutOfSync: {{.app.metadata.name}}"
      body: |
        Application: {{.app.metadata.name}}
        Environment: production
        Sync status: {{.app.status.sync.status}}
        Health status: {{.app.status.health.status}}
        Revision: {{.app.status.sync.revision}}
        Argo CD: {{.context.argocdUrl}}/applications/{{.app.metadata.name}}

  trigger.on-production-outofsync: |
    - description: Notify when a production application becomes OutOfSync.
      when: app.status.sync.status == 'OutOfSync'
      send:
        - app-production-outofsync
