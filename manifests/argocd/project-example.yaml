apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: example-platform
  namespace: argocd
spec:
  description: Example GitOps project for portfolio documentation
  sourceRepos:
    - https://gitlab.example.local/platform/*
  destinations:
    - namespace: example-stage
      server: https://kubernetes.default.svc
    - namespace: example-production
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
